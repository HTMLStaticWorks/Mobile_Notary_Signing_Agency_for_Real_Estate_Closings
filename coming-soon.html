  <title>Coming Soon – SignSure Mobile Notary</title>
  <meta name="description" content="Something exciting is coming from SignSure Mobile Notary. Sign up to be notified when we launch new features.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>
  <div class="auth-floating-toggles" style="position: absolute; top: 1.5rem; right: 1.5rem; display: flex; gap: 0.5rem; z-index: 100;">
    <button class="navbar__rtl-toggle" id="rtl-toggle" aria-label="Toggle text direction" style="background: var(--surface-card); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); width: 40px; height: 40px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-primary); transition: all 0.3s;">
      <i class="ri-arrow-left-right-line"></i>
    </button>
    <button class="navbar__theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" style="background: var(--surface-card); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); width: 40px; height: 40px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-primary); transition: all 0.3s;">
      <i class="ri-moon-line theme-icon"></i>
    </button>
  </div>

  <main class="coming-soon">
    <div class="hero__shapes">
      <div class="hero__shape"></div>
      <div class="hero__shape"></div>
      <div class="hero__shape"></div>
    </div>
    <div class="coming-soon__content">
      <div class="coming-soon__logo">
        <span class="coming-soon__logo-icon"><i class="ri-quill-pen-line"></i></span>
        SignSure
      </div>

      <h1>Something Big Is Coming</h1>
      <p>We're launching a new feature that will revolutionize how title companies manage their closings. Be the first to know.</p>

      <div class="countdown" id="countdown">
        <div class="countdown__item">
          <span class="countdown__value" id="cd-days">00</span>
          <span class="countdown__label">Days</span>
        </div>
        <div class="countdown__item">
          <span class="countdown__value" id="cd-hours">00</span>
          <span class="countdown__label">Hours</span>
        </div>
        <div class="countdown__item">
          <span class="countdown__value" id="cd-minutes">00</span>
          <span class="countdown__label">Minutes</span>
        </div>
        <div class="countdown__item">
          <span class="countdown__value" id="cd-seconds">00</span>
          <span class="countdown__label">Seconds</span>
        </div>
      </div>

      <form class="newsletter-form" data-validate id="newsletter-form">
        <input type="email" name="email" class="form__input" placeholder="Enter your email" required aria-label="Email address">
        <button type="submit" class="btn btn--primary">Notify Me</button>
      </form>
      <div class="form__success" id="newsletter-success" style="max-width: 460px; margin: var(--space-4) auto 0; background: rgba(45,139,90,0.15); border-color: rgba(45,139,90,0.4); color: rgba(255,255,255,0.9);">
        <i class="ri-check-line"></i> You're on the list! We'll notify you at launch.
      </div>

      <div style="margin-block-start: var(--space-8);">
        <a href="index.html" style="color: rgba(255,255,255,0.5); font-size: var(--size-label); transition: color 0.2s;">
          <i class="ri-arrow-left-line"></i> Back to SignSure
        </a>
      </div>
    </div>
  </main>

  <!-- Back to Top Button -->
  <button class="back-to-top" id="back-to-top" aria-label="Back to top" title="Back to top">
    <i class="ri-arrow-up-line"></i>
  </button>

  <script src="assets/js/main.js"></script>
  <script>
    // Newsletter form
    const newsletterForm = document.getElementById('newsletter-form');
    const newsletterSuccess = document.getElementById('newsletter-success');
    if (newsletterForm) {
      newsletterForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = newsletterForm.querySelector('input[type="email"]');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (email.value && emailRegex.test(email.value)) {
          newsletterSuccess.classList.add('visible');
          newsletterForm.reset();
          setTimeout(() => newsletterSuccess.classList.remove('visible'), 5000);
        }
      });
    }
  </script>
</body>
</html>
