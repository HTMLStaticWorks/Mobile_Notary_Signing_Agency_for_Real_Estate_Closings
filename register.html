  <title>Register – SignSure Client Portal</title>
  <meta name="description" content="Create your SignSure title company client account. Start scheduling notary signings and managing your closings online.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="auth-page">

  <!-- Theme & RTL Toggles -->
  <div class="auth-floating-toggles">
    <button class="auth-toggle-btn" id="rtl-toggle" aria-label="Toggle text direction">
      <i class="ri-arrow-left-right-line"></i>
    </button>
    <button class="auth-toggle-btn" id="theme-toggle" aria-label="Toggle dark mode">
      <i class="ri-moon-line theme-icon"></i>
    </button>
  </div>

  <main>
    <div class="auth-card">
      <!-- Brand Name → links to home -->
      <a href="index.html" class="auth-card__logo" aria-label="Go to SignSure home">
        <span class="auth-card__logo-icon"><i class="ri-quill-pen-line"></i></span>
        SignSure
      </a>
      <h1 class="auth-card__title">Create Account</h1>
      <p class="auth-card__subtitle">Start managing your real estate closings</p>

      <form data-validate id="register-form">
        <div class="form__group">
          <label class="form__label" for="register-name">Full Name <span class="required">*</span></label>
          <input type="text" id="register-name" name="name" class="form__input" placeholder="John Smith" required>
          <div class="form__error"></div>
        </div>

        <div class="form__group">
          <label class="form__label" for="register-email">Email <span class="required">*</span></label>
          <input type="email" id="register-email" name="email" class="form__input" placeholder="you@titlecompany.com" required>
          <div class="form__error"></div>
        </div>

        <div class="form__group">
          <label class="form__label" for="register-password">Password <span class="required">*</span></label>
          <div class="form__input-wrapper">
            <input type="password" id="register-password" name="password" class="form__input" placeholder="Minimum 8 characters" required>
            <button type="button" class="form__eye-btn" id="toggle-register-password" aria-label="Toggle password visibility">
              <i class="ri-eye-line" id="register-eye-icon"></i>
            </button>
          </div>
          <div class="form__error"></div>
        </div>

        <div class="form__group">
          <label class="form__label" for="register-confirm">Confirm Password <span class="required">*</span></label>
          <div class="form__input-wrapper">
            <input type="password" id="register-confirm" name="confirm-password" class="form__input" placeholder="Repeat your password" required>
            <button type="button" class="form__eye-btn" id="toggle-register-confirm" aria-label="Toggle confirm password visibility">
              <i class="ri-eye-line" id="register-confirm-eye-icon"></i>
            </button>
          </div>
          <div class="form__error"></div>
        </div>

        <div class="form__group">
          <label class="form__checkbox">
            <input type="checkbox" name="terms" required>
            <span class="form__checkbox-label">I accept the <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Policy</a></span>
          </label>
          <div class="form__error"></div>
        </div>

        <button type="submit" class="btn btn--primary btn--full">Register</button>
        <div class="form__success">
          <i class="ri-check-line"></i> Account created successfully! Redirecting to login...
        </div>
      </form>

      <div class="auth-divider">or continue with</div>

      <div class="auth-social">
        <button class="auth-social__btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
        <button class="auth-social__btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
          Continue with Apple
        </button>
      </div>

      <div class="auth-card__footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </main>

  <!-- Back to Top Button -->
  <button class="back-to-top" id="back-to-top" aria-label="Back to top" title="Back to top">
    <i class="ri-arrow-up-line"></i>
  </button>

  <script src="assets/js/main.js"></script>
  <script>
    // Eye icon toggles for register page
    function setupEyeToggle(btnId, inputId, iconId) {
      document.getElementById(btnId).addEventListener('click', function() {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'ri-eye-off-line';
        } else {
          input.type = 'password';
          icon.className = 'ri-eye-line';
        }
      });
    }
    setupEyeToggle('toggle-register-password', 'register-password', 'register-eye-icon');
    setupEyeToggle('toggle-register-confirm', 'register-confirm', 'register-confirm-eye-icon');
  </script>
</body>
</html>
